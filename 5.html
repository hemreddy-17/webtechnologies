<title>Scientific Calculator</title>

body{
    margin:0;
    font-family:Segoe UI;
    background:linear-gradient(135deg,#0f172a,#020617);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* Calculator box */
.calculator{
    width:340px;
    background:#111827;
    padding:18px;
    border-radius:18px;
    box-shadow:0 0 25px black;
}

/* Menu */
.menu{
    color:#9ca3af;
    font-size:13px;
    margin-bottom:8px;
}

/* Display */
#display{
    width:100%;
    height:65px;
    border:none;
    outline:none;
    font-size:26px;
    padding:10px;
    text-align:right;
    border-radius:12px;
    background:#e5e7eb;
    margin-bottom:10px;
}

/* History */
#history{
    color:#94a3b8;
    font-size:12px;
    height:18px;
    text-align:right;
    margin-bottom:6px;
}

/* Buttons grid */
.buttons{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:8px;
}

/* Buttons */
button{
    padding:14px;
    font-size:15px;
    border:none;
    border-radius:12px;
    background:#374151;
    color:white;
    cursor:pointer;
    transition:0.2s;
}

button:hover{
    background:#4b5563;
}

.operator{ background:#f59e0b; }
.equal{ background:#10b981; }
.clear{ background:#ef4444; }
.scientific{ background:#2563eb; }

</style>
