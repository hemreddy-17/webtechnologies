```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login & Registration System</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:linear-gradient(135deg,#020617,#0f172a);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

/* Card */
.card{
    width:340px;
    background:#111827;
    padding:25px;
    border-radius:18px;
    box-shadow:0 0 25px black;
    text-align:center;
}

h2{margin-bottom:15px;}

input{
    width:100%;
    padding:11px;
    margin:8px 0;
    border-radius:8px;
    border:none;
    outline:none;
}

/* Buttons */
button{
    width:100%;
    padding:11px;
    margin-top:10px;
    border:none;
    border-radius:8px;
    background:#2563eb;
    color:white;
    font-size:15px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

.switch{
    color:#38bdf8;
    cursor:pointer;
    font-size:13px;
    margin-top:10px;
}

/* dashboard */
#welcome{
    font-size:22px;
    margin-bottom:10px;
}

.hidden{
    display:none;
}

.logout{
    background:#ef4444;
}

.logout:hover{
    background:#dc2626;
}

</style>
</head>

<body>

<div class="card">

<!-- REGISTER FORM -->
<div id="register">
<h2>Create Account</h2>

<input id="regName" placeholder="Full Name">
<input id="regEmail" placeholder="Email">
<input id="regPass" type="password" placeholder="Password">

<button onclick="registerUser()">Register</button>

<div class="switch" onclick="showLogin()">Already have account? Login</div>
</div>


<!-- LOGIN FORM -->
<div id="login" class="hidden">
<h2>User Login</h2>

<input id="loginEmail" placeholder="Email">
<input id="loginPass" type="password" placeholder="Password">

<button onclick="loginUser()">Login</button>

<div class="switch" onclick="showRegister()">New user? Register</div>
</div>


<!-- DASHBOARD -->
<div id="dashboard" class="hidden">
<h2 id="welcome"></h2>
<p>You are successfully logged in 🎉</p>
<button class="logout" onclick="logoutUser()">Logout</button>
</div>

</div>


<script>

/* SWITCH FORMS */

function showLogin(){
document.getElementById("register").classList.add("hidden");
document.getElementById("login").classList.remove("hidden");
}

function showRegister(){
document.getElementById("login").classList.add("hidden");
document.getElementById("register").classList.remove("hidden");
}


/* REGISTER */

function registerUser(){

let name=document.getElementById("regName").value;
let email=document.getElementById("regEmail").value;
let password=document.getElementById("regPass").value;

if(name=="" || email=="" || password==""){
alert("Please fill all fields!");
return;
}

/* check existing */
if(localStorage.getItem(email)){
alert("Account already exists!");
return;
}

let user={
name:name,
email:email,
password:password
};

localStorage.setItem(email,JSON.stringify(user));

alert("Registration Successful!");
showLogin();

}


/* LOGIN */

function loginUser(){

let email=document.getElementById("loginEmail").value;
let password=document.getElementById("loginPass").value;

let data=localStorage.getItem(email);

if(data==null){
alert("User not found!");
return;
}

let user=JSON.parse(data);

if(user.password===password){

localStorage.setItem("sessionUser",user.name);

document.getElementById("login").classList.add("hidden");
document.getElementById("dashboard").classList.remove("hidden");
document.getElementById("welcome").innerText="Welcome, "+user.name;

}else{
alert("Incorrect Password!");
}

}


/* AUTO LOGIN */

let session=localStorage.getItem("sessionUser");

if(session){
document.getElementById("register").classList.add("hidden");
document.getElementById("login").classList.add("hidden");
document.getElementById("dashboard").classList.remove("hidden");
document.getElementById("welcome").innerText="Welcome, "+session;
}


/* LOGOUT */

function logoutUser(){
localStorage.removeItem("sessionUser");
location.reload();
}

</script>

</body>
</html>
```
