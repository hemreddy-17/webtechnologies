<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scientific Calculator Menu</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      margin-top: 50px;
    }

    #menuBtn {
      padding: 10px 20px;
      font-size: 18px;
      cursor: pointer;
    }

    #calculator {
      display: none;
      margin-top: 20px;
      border: 2px solid #333;
      padding: 15px;
      width: 250px;
      margin-left: auto;
      margin-right: auto;
      border-radius: 10px;
    }

    input {
      width: 90%;
      height: 40px;
      font-size: 18px;
      margin-bottom: 10px;
      text-align: right;
    }

    button {
      width: 50px;
      height: 40px;
      margin: 3px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<button id="menuBtn" onclick="toggleMenu()">☰ Open Calculator</button>

<div id="calculator">
  <input type="text" id="display" disabled>

  <br>
  <button onclick="press('7')">7</button>
  <button onclick="press('8')">8</button>
  <button onclick="press('9')">9</button>
  <button onclick="press('/')">÷</button>

  <br>
  <button onclick="press('4')">4</button>
  <button onclick="press('5')">5</button>
  <button onclick="press('6')">6</button>
  <button onclick="press('*')">×</button>

  <br>
  <button onclick="press('1')">1</button>
  <button onclick="press('2')">2</button>
  <button onclick="press('3')">3</button>
  <button onclick="press('-')">−</button>

  <br>
  <button onclick="press('0')">0</button>
  <button onclick="press('.')">.</button>
  <button onclick="calculate()">=</button>
  <button onclick="press('+')">+</button>

  <br>
  <button onclick="scientific('sin')">sin</button>
  <button onclick="scientific('cos')">cos</button>
  <button onclick="scientific('tan')">tan</button>
  <button onclick="scientific('log')">log</button>

  <br>
  <button onclick="scientific('sqrt')">√</button>
  <button onclick="press('**')">x²</button>
  <button onclick="clearDisplay()">C</button>
</div>

<script>
  function toggleMenu() {
    let calc = document.getElementById("calculator");
    calc.style.display = (calc.style.display === "none") ? "block" : "none";
  }

  function press(value) {
    document.getElementById("display").value += value;
  }

  function calculate() {
    try {
      document.getElementById("display").value =
        eval(document.getElementById("display").value);
    } catch {
      alert("Invalid Expression");
    }
  }

  function clearDisplay() {
    document.getElementById("display").value = "";
  }

  function scientific(func) {
    let value = document.getElementById("display").value;
    try {
      switch(func) {
        case 'sin':
          document.getElementById("display").value = Math.sin(value);
          break;
        case 'cos':
          document.getElementById("display").value = Math.cos(value);
          break;
        case 'tan':
          document.getElementById("display").value = Math.tan(value);
          break;
        case 'log':
          document.getElementById("display").value = Math.log10(value);
          break;
        case 'sqrt':
          document.getElementById("display").value = Math.sqrt(value);
          break;
      }
    } catch {
      alert("Error");
    }
  }
</script>

</body>
</html>
